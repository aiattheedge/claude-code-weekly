name: Render images
on:
  push:
    branches: [main]
    paths: ["render/**/jobs.json"]
  workflow_dispatch:
    inputs:
      test:
        description: "Render the sample job only and keep the PNGs as a run artifact (no commit)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: render-images
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render
        env:
          RENDER_DIR: ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && 'scripts/sample' || '' }}
        run: node scripts/render.js
      - name: Keep test images
        if: github.event_name == 'workflow_dispatch' && inputs.test
        uses: actions/upload-artifact@v4
        with:
          name: test-images
          path: scripts/sample/out/
      - name: Commit images
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images og-cover-v*.png
          git diff --cached --quiet || git commit -m "Render images"
          git push
