name: Kling walk-in test
# Makes a short silent Kling clip of Ian walking up to the camera from one photo, through fal.ai.
# Runs only when started by hand. The photo is an asset on the draft release named in
# video/config.json (kling.photo_release), or a photo pasted into a GitHub description, so it
# never sits in the repo. The clip goes only to that draft release (no run artifact, since
# artifacts on a public repo can be downloaded by any GitHub user).
on:
  workflow_dispatch:
    inputs:
      photo:
        description: "Photo file name on the kling-inputs draft release, e.g. ian-full-length.jpg (or leave blank and give photo_url)"
        required: false
        default: ""
      photo_url:
        description: "Or a photo pasted into a GitHub description: https://github.com/user-attachments/assets/<id>"
        required: false
        default: ""
      style:
        description: "walk_in = he walks into an empty frame; walk_up = he starts in frame and walks toward the camera"
        type: choice
        options: [walk_in, walk_up]
        default: walk_in
      prompt:
        description: "Optional prompt (blank = the one in video/config.json)"
        required: false
        default: ""
      duration:
        description: "Clip length in seconds"
        type: choice
        options: ["5", "10"]
        default: "5"
      mode:
        description: "dry-run is free (checks the photo and cost). render spends fal.ai credit (about $0.35 per 5 s)."
        type: choice
        options: [dry-run, render]
        default: dry-run
permissions:
  contents: write
concurrency:
  group: kling-walkin
  cancel-in-progress: false
jobs:
  walkin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Make sure the private draft release exists
        # The release holds Ian's photo and the test clips, so it must stay a draft (only repo members see it).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(python3 -c 'import json; print(json.load(open("video/config.json"))["kling"]["photo_release"])')
          if ! gh release view "$release" >/dev/null 2>&1; then
            gh release create "$release" --draft --title "Kling walk-in inputs and test clips (private draft)" \
              --notes "Private draft: the photo for the Kling walk-in test and the clips it makes. Do not publish."
            echo "Created draft release $release"
          elif [ "$(gh release view "$release" --json isDraft --jq .isDraft)" != "true" ]; then
            gh release edit "$release" --draft=true
            echo "::warning::Release $release had been published; switched it back to a draft."
          fi

      - name: Get the photo
        id: photo
        env:
          GH_TOKEN: ${{ github.token }}
          PHOTO: ${{ inputs.photo }}
          PHOTO_URL: ${{ inputs.photo_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/in"
          if [ -n "$PHOTO_URL" ]; then
            if ! printf '%s' "$PHOTO_URL" | grep -Eq '^https://github\.com/user-attachments/assets/[0-9a-f-]{36}$'; then
              echo "::error::photo_url must be https://github.com/user-attachments/assets/<id>"; exit 1
            fi
            curl -fsSL --max-filesize 10000000 -o "$RUNNER_TEMP/in/photo.bin" "$PHOTO_URL"
            case "$(file -b --mime-type "$RUNNER_TEMP/in/photo.bin")" in
              image/jpeg) ext=jpg ;; image/png) ext=png ;; image/webp) ext=webp ;;
              *) echo "::error::photo_url is not a JPEG, PNG or WebP image."; exit 1 ;;
            esac
            mv "$RUNNER_TEMP/in/photo.bin" "$RUNNER_TEMP/in/photo.$ext"
            echo "path=$RUNNER_TEMP/in/photo.$ext" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$PHOTO" | grep -Eq '^[A-Za-z0-9._-]+\.(jpe?g|png|webp)$'; then
            echo "::error::Give photo (a .jpg, .png or .webp name on the draft release) or photo_url."; exit 1
          fi
          release=$(python3 -c 'import json; print(json.load(open("video/config.json"))["kling"]["photo_release"])')
          if ! gh release download "$release" --pattern "$PHOTO" --dir "$RUNNER_TEMP/in"; then
            echo "::error::$PHOTO is not on the $release draft release. Attach it there and run again."
            exit 1
          fi
          echo "path=$RUNNER_TEMP/in/$PHOTO" >> "$GITHUB_OUTPUT"

      - name: Make the clip
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PHOTO_PATH: ${{ steps.photo.outputs.path }}
          STYLE: ${{ inputs.style }}
          PROMPT: ${{ inputs.prompt }}
          DURATION: ${{ inputs.duration }}
          MODE: ${{ inputs.mode }}
        run: |
          out="$RUNNER_TEMP/walkin"
          if [ "$MODE" = "render" ]; then
            python3 scripts/video/kling_walkin.py "$PHOTO_PATH" "$out" --style "$STYLE" --prompt "$PROMPT" --duration "$DURATION"
          else
            python3 scripts/video/kling_walkin.py "$PHOTO_PATH" "$out" --style "$STYLE" --prompt "$PROMPT" --duration "$DURATION" --dry-run
          fi

      - name: Save clip to the draft release
        if: inputs.mode == 'render'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(python3 -c 'import json; print(json.load(open("video/config.json"))["kling"]["photo_release"])')
          dir="$RUNNER_TEMP/walkin"
          cp "$dir/walkin.mp4" "$dir/walkin-$GITHUB_RUN_ID.mp4"
          cp "$dir/walkin.json" "$dir/walkin-$GITHUB_RUN_ID.json"
          gh release upload "$release" "$dir/walkin-$GITHUB_RUN_ID.mp4" "$dir/walkin-$GITHUB_RUN_ID.json" --clobber
          echo "- Clip: walkin-$GITHUB_RUN_ID.mp4 on draft release \`$release\`" >> "$GITHUB_STEP_SUMMARY"
